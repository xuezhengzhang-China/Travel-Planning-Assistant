name: tpa-b-db

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: travel_planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/remote-db/init-test.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travel_planner -d travel_planner']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
